<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post</title>
</head>
<style>
    *{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    list-style: none;
    text-decoration: none;
}
 body{
    height: 100vh;
    width: 100%;
    font-family: Arial, Helvetica, sans-serif;
    background-image: url(openbook.jpg);
   
}
nav{
    position: fixed;
    top: 0;
    left: 0;
    width: 12rem;
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: 1.5rem;
    background-color: rgba(9,9,77,0.9);
    font-size: 1.3rem;

}

nav li{
    margin: 13px 0;
    width: 100%;
    padding: 5px;
    border-radius: 3px;
    transition: all 160ms ease-in;

}
nav li a{
    color: #fff;
    width: 100%;
    display: block;



}
nav li:hover{
     cursor: pointer;
     background-color: #09094d;
     
}
.active{
    background-color: #09094d;
    
}
.main{
    position: fixed;
    left: 12rem;
    width: calc(100% - 12rem);
    height: 100%;
    background-color: rgb(241, 238, 238);

}
h1{
    text-align: center;
    background: linear-gradient(#09094d, gray);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    font-family: cursive;
    font-size: 30px;
}
.title{
    padding: 15px;
}
form{
    width: 50%;
    height: 400px;
    margin: auto;
    display: flex;
    flex-direction: column;
    align-items: center;
}
p{
    font-size: 20px;
    margin: 10px 0;
    font-family: cursive;
    color: #09094d;
    text-align: center;
    margin-bottom: 20px;
}
label{
    font-family: sans-serif;
    font-size: 15px;
    width: 100%;
    margin-bottom: 5px;

}
input, textarea{
    margin-bottom: 20px;
    border: none;
    border-radius: 4px;
    width: 100%;
    font: 18px;
    color: black;
    padding: 5px;
    font-family: sans-serif;


}
input:focus{
    outline: none;
}
#title, #tags{
    height: 28px;
}
#poem{
    height: 100px;
}
button{
    width: 30%;
    height: 30px;
    border: none;
    background-color: #09094d;
    color: #fff;
    padding: 5px;
    font-size: 16px;
    border-radius: 4px;
}
button:hover{
    background-color: #171775;
    cursor: pointer;
}
</style>
<body>
    <nav>
        <ul>
            <li><a href="dashboard.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li class="active"><a href="post.html">Post</a></li>
            <li><a href="saved.html">Saved</a></li>
            <li><a href="fave.html">Favorites</a></li>
            <li><a href="setting.html">Settings</a></li>
        </ul>
    </nav>
    <div class="main">
        <div class="title">
            <h1>Poetica</h1>
        </div>
        <form>
            <p>Share your story with the world!</p>
            <label for="title">Title of your Poem:</label>
            <input id="title" type="text">
            <label for="poem">Write your Poem:</label>
            <textarea name="poem" id="poem"></textarea>
            <label for="tags">Tags(optional):</label>
            <input id="tags" type="text">
            <button>Post</button>
        </form>
    </div>
</body>
</html>
