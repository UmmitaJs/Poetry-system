<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="register.css">
</head>
<body>
    <div class="container">
        <div class="main">
            
            <form action="#">
                <h2>Poetica</h2>
            <h3>Join us Now to begin your intellectual journey!</h3>
            <div class="inline">
                <fieldset>
                    <legend>First Name</legend>
                    <input type="text">
                </fieldset>
                <fieldset>
                    <legend>Last Name</legend>
                    <input type="text">
                </fieldset>
                <fieldset>
                    <legend>Middle Name</legend>
                    <input type="text">
                </fieldset>
                
            </div>
                <fieldset>
                    <legend>Enter your Email</legend>
                    <input type="email">
                </fieldset>
                <div class="inline">
                    <fieldset class="wide">
                        <legend>Create a password</legend>
                        <input type="password">
                    </fieldset>
                    <fieldset class="wide">
                        <legend>Confirm Password</legend>
                        <input type="password">
                    </fieldset>
                </div>
                
                <div class="inline">
                    <fieldset class="wide">
                        <legend >Are you a Student?</legend>
                        <select name="student" id="">
                            <option value="">Yes</option>
                            <option value="">No</option>
                        </select>
                    </fieldset>
                    <fieldset class="wide">
                        <legend>Select your country</legend>
                        <select name="" id="">
                            <option>Nigeria</option>
                            <option>Niger</option>
                            <option>Ghana</option>
                            <option>Burkina Faso</option>
                            <option>Benin</option>
                            <option>Mali</option>
                            <option>Togo</option>
                            <option>Senegal</option>
                            <option>Cameroon</option>
                            <option>None of the above</option>



    
                        </select>
                    </fieldset>
                </div>
                
                <fieldset class="textarea">
                    <legend>Why do you want to join us?</legend>
                    <textarea name="" id="" rows="4"></textarea>
                </fieldset>
                <fieldset class="file">
                    <legend>Upload your poems here:</legend>
                    <input type="file">
                </fieldset>
                <button>Submit</button>
                
            </form>
        </div>
        </div>
    </div>
</body>
</html>
