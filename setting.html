<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>
</head>
<style>
     *{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    list-style: none;
    text-decoration: none;
}
 body{
    height: 100vh;
    width: 100%;
    font-family: Arial, Helvetica, sans-serif;
    background-image: url(openbook.jpg);
   
}
nav{
    position: fixed;
    top: 0;
    left: 0;
    width: 12rem;
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: 1.5rem;
    background-color: rgba(9,9,77,0.9);
    font-size: 1.3rem;

}

nav li{
    margin: 13px 0;
    width: 100%;
    padding: 5px;
    border-radius: 3px;
    transition: all 160ms ease-in;

}
nav li a{
    color: #fff;
    width: 100%;
    display: block;


}
nav li:hover{
     cursor: pointer;
     background-color: #09094d;
     
}
.active{
    background-color: #09094d;
    
}
.main{
    position: fixed;
    left: 12rem;
    width: calc(100% - 12rem);
    height: 100%;
    background-color: rgb(241, 238, 238);

}
h1{
    text-align: center;
    background: linear-gradient(#09094d, gray);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    font-family: cursive;
    font-size: 30px;
}
.title{
    padding: 15px;
}
.body{
    display: flex;
    flex-direction: column;
    width: 30%;
    height: 55%;
    margin: auto;
    background-color: #fff;
    color: #09094d;
    margin-top: 30px;
    gap: 30px;
    font-family: Arial, Helvetica, sans-serif;
    border-radius: 10px;
    padding: 20px;
}
h4{
    text-align: center;
    font-size: 18px;
}
label{
    font-size: 15px;
}
select{
    border-color: grey;
    border-radius: 4px;
    margin-left: 5px;
    color: grey;
    width: 100%;
    margin-top: 5px;
}
select:focus{
    outline: none;
}
</style>
<body>
    <nav>
        <ul>
            <li><a href="dashboard.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="post.html">Post</a></li>
            <li><a href="saved.html">Saved</a></li>
            <li><a href="fave.html">Favorites</a></li>
            <li class="active"><a href="setting.html">Settings</a></li>
        </ul>
    </nav>
    <div class="main">
        <div class="title">
            <h1>Poetica</h1>
        </div>
        <div class="body">
            <h4>Settings</h4>
            <label for="notification">Notification <select name="note" id="notification">
                <option>Show notification</option>
                <option>Always ask</option>
                <option>Never</option>
            </select></label>
            <label for="lang"> App language
                <select name="lang" id="lang">
                    <option>English</option>
                    <option>Hausa</option>
                    <option>Igbo</option>
                    <option>Yoruba</option>
                </select>
            </label>
            <label for="acc"> Account type
                <select name="acc" id="acc">
                    <option>Public</option>
                    <option>Private</option>
                </select>
            </label>
            <label for="rec">Recommendations
                <select name="rec" id="rec">
                    <option>Send recommendations</option>
                    <option>no recommendations</option>
                </select>
            </label>

        </div>
</body>
</html>
