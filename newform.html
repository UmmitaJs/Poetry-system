<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated label</title>
</head>
<style>
    *,*::before, *::after{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        
    }
    body{
        background-image: url(openbook.jpg);
        height: 100vh;
        width: 100%;
        display: grid;
        place-items: center;
    }
    .container{
           background-color: #fff;
           width: 80%;
           height: 80vh;
           padding: 2rem;
    }
    .inline{
        display: flex;
        justify-content: space-between;
        gap: 1rem;
    }
    .box{
        position: relative;
        width: 100%;
    }
    input{
        position: relative;
        top: 3.5rem;
        left: 0;
        width: 100%;
        height: 2rem;
        border: 2px solid grey;
        border-radius: 0.5rem;
        font-family: inherit;
        font-size: inherit;
        color: #fff;
        outline: none;
        padding: 1.3rem;
        background: none;
        transition: all 160ms ease-in;
        margin-bottom: 20px;
        
    }
    input:hover{
        border-color: rgb(88, 88, 245);
    }
    input:focus{
        border-color: blue;
    }
    label{
        position: relative;
        left: 1rem;
        top: 0rem;
        padding: 0 0.5rem;
        color: grey;
        font-size: 1.2rem;
        cursor: text;
        transition: top 200ms ease-in, 
        left 200ms ease-in,
        font-size 200ms ease-in;
        background-color: #fff;

    }
    input:focus ~ label{
        top: -1.2rem;
        font-size: 1rem;
        left: 0.9rem;

    }
    h2{
    text-align: center;
    background: linear-gradient(#09094d, gray);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    font-family: cursive;
    margin-bottom: -3px;
    margin-top: -10px;
    font-size: 30px;
}
h3{
    text-align: center;
    color: grey;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 15px;
}
</style>
<body>
    <div class="container">
        <h2>Poetica</h2>
            <h3>Join us Now to begin your intellectual journey!</h3>
        <form>
        <div class="inline">
            <div class="box">
                <input type="text" id="fname">
                <label for="fname">First Name</label>
            </div>
            <div class="box">
                <input type="text" id="lname">
                <label for="lname">Last Name</label>
            </div> 
            <div class="box">
                <input type="text" id="mname">
                <label for="mname">Middle Name</label>
            </div>
        </div>
            <div class="box">
            <input type="email" id="email" class="long">
            <label for="email">Email</label>   
            </div>

        <div class="inline">
            <div class="box">
                <input type="password">
                <label for="password">Create Password</label>
            </div>
            <div class="box">
                <input type="password">
                <label for="password">Confirm Password</label>
            </div>
        </div>

        </form>
    </div>
</body>
</html>
